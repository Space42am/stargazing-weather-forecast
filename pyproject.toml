[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Keep the unchanged forecast implementation's existing style outside this release.
[tool.ruff.lint.per-file-ignores]
"fetch/weather_api.py" = ["I001"]
"processing/filter.py" = ["F401"]
"processing/recommend.py" = ["I001", "E701"]
