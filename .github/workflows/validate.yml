name: Validate weather service
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint and test preserved weather behavior
        run: |
          ruff check .
          pytest -q
      - name: Build production image
        run: docker build -t weather-check .
      - name: Verify API startup and Chromium as the application user
        run: |
          docker run --rm --entrypoint python weather-check -c "from formatting.html_formatter import screenshot_html; assert screenshot_html('<html><body>Weather renderer verification</body></html>').startswith(b'\x89PNG')"
          docker run -d --name weather-check -p 127.0.0.1:8080:8080 -e WEATHER_API_TOKEN=ci-fixture-only -e WEATHER_SHEET_ENABLED=false weather-check
          trap 'docker rm -f weather-check' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/healthz
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/monitors)" = 401
          curl --fail --silent -H 'Authorization: Bearer ci-fixture-only' http://127.0.0.1:8080/v1/monitors
